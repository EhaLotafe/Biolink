<!-- index.html -->
<!DOCTYPE html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Correction : Viewport standard pour l'accessibilité -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>BioLink RDC | Votre identité numérique centralisée</title>
    <meta name="description" content="Créez votre page de liens professionnelle en 1 minute. Idéal pour les créateurs et entrepreneurs en RDC." />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              glass: {
                50: 'rgba(255, 255, 255, 0.05)',
                100: 'rgba(255, 255, 255, 0.1)',
                200: 'rgba(255, 255, 255, 0.2)',
              },
              brand: {
                primary: '#6366f1',
                secondary: '#a855f7',
                accent: '#22d3ee',
              },
              space: {
                950: '#030712',
                900: '#0B1D3A',
                800: '#111827',
              }
            },
            animation: {
              'gradient': 'gradient 8s linear infinite',
              'float': 'float 6s ease-in-out infinite',
            },
            keyframes: {
              gradient: {
                '0%, 100%': { 'background-size': '200% 200%', 'background-position': 'left center' },
                '50%': { 'background-size': '200% 200%', 'background-position': 'right center' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-15px)' },
              }
            }
          },
        },
      }
    </script>
    
    <style>
      :root {
        --glass-border: rgba(255, 255, 255, 0.1);
      }
      body {
        font-family: 'Inter', sans-serif;
        background: radial-gradient(circle at top right, #1e1b4b, #030712);
        color: #f9fafb;
        min-height: 100vh;
      }
      
      .glass-card {
        background: rgba(255, 255, 255, 0.03);
        /* Correction : Ordre des préfixes CSS */
        -webkit-backdrop-filter: blur(16px);
        backdrop-filter: blur(16px);
        border: 1px solid var(--glass-border);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      }

      ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
